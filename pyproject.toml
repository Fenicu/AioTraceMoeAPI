[project]
name = "aiotracemoeapi"
version = "4.0.0"
description = "Async wrapper for Trace.moe API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fenicu" }]
requires-python = ">=3.10"
keywords = ["trace.moe", "tracemoe", "anime", "search", "async", "asyncio", "httpx", "api", "wrapper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/Fenicu/AioTraceMoeAPI"
Repository = "https://github.com/Fenicu/AioTraceMoeAPI"
Issues = "https://github.com/Fenicu/AioTraceMoeAPI/issues"
Changelog = "https://github.com/Fenicu/AioTraceMoeAPI/blob/master/CHANGELOG.md"
"API Docs" = "https://soruly.github.io/trace.moe-api/"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "ERA",    # eradicate
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "FA",     # flake8-future-annotations
]
ignore = [
    "PLR0913",  # too-many-arguments
    "PLR2004",  # magic-value-comparison
    "ANN401",   # any-type
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ANN", "PLR2004", "RUF001"]
"examples/**" = ["T20", "ANN"]
